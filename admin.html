<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" type="image/x-icon">
    <meta name="color-scheme" content="light dark">
    <script>
      // Apply the saved or system color theme before first paint to avoid a flash.
      (function () {
        var theme = 'light';
        try {
          var stored = window.localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <title>Moderation – Coaster2STL</title>
  </head>
  <body>
    <div id="admin"></div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
